<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clickable Photo Link</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7fafc;
      font-family: system-ui, sans-serif;
    }

    .photo-link {
      display: block;
      width: min(360px, 90vw);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(30, 41, 59, 0.18);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .photo-link:hover,
    .photo-link:focus-visible {
      transform: translateY(-5px) scale(1.015);
      box-shadow: 0 24px 55px rgba(30, 41, 59, 0.24);
      outline: 3px solid #e07a5f;
      outline-offset: 5px;
    }

    .photo-link img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <!-- 1. Add your photo file or image URL where it says PHOTO_URL. -->
  <!-- 2. Add the website you want to open where it says DESTINATION_URL. -->
  <a class="photo-link"
     href="DESTINATION_URL"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Open my desired website">
    <img src="PHOTO_URL"
         alt="A photo for my clickable link">
  </a>
</body>
</html>
