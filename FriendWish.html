<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send a Birthday Wish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #FAF7F2;
      --pearl: #FFFDF9;
      --charcoal: #1E293B;
      --muted: #526071;
      --coral: #E07A5F;
      --coral-dark: #C96449;
      --seafoam: #63947C;
      --gold: #D4A373;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 1.25rem;
      display: grid;
      place-items: center;
      color: var(--charcoal);
      background:
        radial-gradient(circle at 82% 18%, rgba(212, 163, 115, 0.18), transparent 55%),
        var(--cream);
      font-family: "Plus Jakarta Sans", sans-serif;
      line-height: 1.6;
    }
    .card {
      width: min(100%, 520px);
      padding: clamp(1.5rem, 6vw, 2.75rem);
      border: 1px solid rgba(212, 163, 115, 0.32);
      border-radius: 28px;
      background: rgba(255, 253, 249, 0.9);
      box-shadow: 0 14px 36px -10px rgba(30, 41, 59, 0.14);
    }
    .badge {
      display: inline-block;
      margin-bottom: 0.75rem;
      padding: 0.3rem 0.8rem;
      border: 1px solid rgba(129, 178, 154, 0.35);
      border-radius: 999px;
      background: rgba(129, 178, 154, 0.16);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 0.5rem;
      font: 700 clamp(1.8rem, 7vw, 2.5rem)/1.2 "Playfair Display", Georgia, serif;
    }
    .intro, #formStatus { color: var(--muted); }
    form { display: grid; gap: 0.9rem; margin-top: 1.5rem; }
    label { display: grid; gap: 0.35rem; font-size: 0.88rem; font-weight: 600; }
    input, textarea {
      width: 100%;
      padding: 0.8rem 0.95rem;
      border: 1px solid rgba(212, 163, 115, 0.45);
      border-radius: 14px;
      background: var(--pearl);
      color: var(--charcoal);
      font: inherit;
    }
    input:focus, textarea:focus { outline: 2px solid rgba(224, 122, 95, 0.35); border-color: var(--coral); }
    textarea { min-height: 130px; resize: vertical; }
    button {
      padding: 0.85rem 1.25rem;
      border: 0;
      border-radius: 999px;
      background: var(--coral);
      color: white;
      font: 700 0.95rem "Plus Jakarta Sans", sans-serif;
      cursor: pointer;
    }
    button:hover { background: var(--coral-dark); }
    button:disabled { cursor: wait; opacity: 0.65; }
    #formStatus { min-height: 1.5rem; margin: 0; font-size: 0.88rem; }
    #formStatus.success { color: var(--seafoam); }
    #formStatus.error { color: var(--coral-dark); }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">A little birthday kindness</span>
    <h1>Send a wish ✨</h1>
    <p class="intro">Leave a birthday message to your friend <h1>Theint Nwe Soe</h1> and it will appear in the glowing wish jar.</p>
    <form id="friendWishForm">
      <label for="sender">Your name
        <input id="sender" name="sender" type="text" maxlength="28" autocomplete="name" required />
      </label>
      <label for="message">Your birthday wish
        <textarea id="message" name="message" maxlength="160" required></textarea>
      </label>
      <button type="submit">Add my wish to the jar</button>
      <p id="formStatus" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="wish-config.js"></script>
  <script src="wishes.js"></script>
  <script>
    const form = document.getElementById("friendWishForm");
    const status = document.getElementById("formStatus");
    if (!window.WishService.isConfigured()) {
      status.textContent = "Browser mode: this wish will be saved on this device.";
      status.className = "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const sender = document.getElementById("sender").value.trim();
      const message = document.getElementById("message").value.trim();
      const button = form.querySelector('button[type="submit"]');

      if (!sender || !message) {
        status.textContent = "Please enter your name and wish.";
        status.className = "error";
        return;
      }

      button.disabled = true;
      status.textContent = "Sending your wish...";
      status.className = "";
      try {
        await window.WishService.submitWish(sender, message);
        form.reset();
        status.textContent = window.WishService.isConfigured()
          ? "Your wish is in the jar. Thank you!"
          : "Your wish was saved in this browser. Thank you!";
        status.className = "success";
      } catch (error) {
        status.textContent = `Your wish could not be sent: ${error.message}`;
        status.className = "error";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
